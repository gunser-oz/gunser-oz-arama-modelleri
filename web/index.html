<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Günser Öz Arama</title>
<style>
  :root { --bg:#f6f7f9; --kart:#fff; --metin:#1b1f24; --soluk:#6b7280; --vurgu:#1f6feb; --cizgi:#e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --kart:#181b21; --metin:#e6e8eb; --soluk:#9aa3ad; --vurgu:#58a6ff; --cizgi:#2a2f37; } }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--metin); }
  main { max-width:900px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .alt { color:var(--soluk); font-size:14px; margin:0 0 20px; }
  .kart { background:var(--kart); border:1px solid var(--cizgi); border-radius:12px; padding:20px; margin-bottom:16px; }
  .satir { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; }
  .satir > div { flex:1; min-width:220px; }
  label { display:block; font-size:13px; color:var(--soluk); margin-bottom:6px; }
  input { width:100%; font:inherit; padding:11px 12px; border:1px solid var(--cizgi); border-radius:8px; background:var(--bg); color:var(--metin); }
  .btn { background:var(--vurgu); color:#fff; border:none; padding:12px 18px; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .ilerleme { height:6px; background:var(--cizgi); border-radius:3px; overflow:hidden; margin-top:12px; }
  .ilerleme i { display:block; height:100%; width:0; background:var(--vurgu); transition:width .2s; }
  .sonuc { padding:12px 0; border-top:1px solid var(--cizgi); font-size:14px; line-height:1.5; }
  .sonuc:first-child { border-top:none; }
  .kaynak { font-size:12px; color:var(--vurgu); margin-bottom:4px; }
  mark { background:#fff3a8; color:inherit; border-radius:3px; padding:0 2px; }
  @media (prefers-color-scheme: dark) { mark { background:#6b5b00; } }
  .sonuc b { color:var(--vurgu); font-weight:600; }
  .skor { font-size:12px; color:var(--soluk); margin-top:4px; }
  .not { font-size:12px; color:var(--soluk); margin-top:8px; }
  .hata { color:#d1242f; font-size:14px; }
  .bilgi { font-size:13px; color:var(--soluk); padding:0 0 10px; }
  .etiket { display:inline-block; font-size:11px; background:var(--vurgu); color:#fff; border-radius:4px; padding:1px 6px; margin-left:6px; vertical-align:middle; }
</style>
</head>
<body>
<main>
  <h1>Günser Öz Arama</h1>
  <p class="alt" id="durum">Model yükleniyor, ilk açılışta yaklaşık 120 MB iner ve tarayıcı önbelleğinde kalır…</p>
  <div class="kart">
    <div class="satir">
      <div><label>Sorgu</label><input id="sorgu" placeholder="örn. yargılama çok uzun sürdü tazminat alabilir miyim" autofocus></div>
      <div style="flex:0 0 90px"><label>Sonuç</label><input id="k" type="number" value="5" min="1" max="20"></div>
      <button class="btn" id="araBtn" disabled>Ara</button>
    </div>
    <div class="ilerleme"><i id="bar"></i></div>
    <p class="not">Arama tamamen tarayıcınızda çalışır; sorgularınız hiçbir sunucuya gönderilmez. Sonuçta <mark>sarı</mark> cümle sorguya en yakın cümledir, <b>koyu</b> kelimeler sorgudaki kelimelerdir.</p>
  </div>
  <div class="kart" id="sonuclar" style="display:none"></div>
  <p class="hata" id="hata"></p>
</main>
<script type="module">
import { pipeline, env } from "./lib/transformers.min.js";
// Statik sunucular .mjs uzantısını JavaScript olarak sunmayabiliyor; dosyaları açık adla ver
env.backends.onnx.wasm.wasmPaths = {
  mjs: new URL("./lib/ort-wasm-simd-threaded.jsep.js", location.href).href,
  wasm: new URL("./lib/ort-wasm-simd-threaded.jsep.wasm", location.href).href,
};
env.allowRemoteModels = false;
env.allowLocalModels = true;
env.localModelPath = "./";

const $ = s => document.querySelector(s);
const durum = m => $("#durum").textContent = m;
let model, vektorler, olcek, meta, boyut;
const metinOnbellek = new Map();
async function metinGetir(i) {
  // Metinler 200'er parçalık gruplarda; yalnızca gösterilecek sonuçların grubu çekilir
  const g = Math.floor(i / meta.grup);
  if (!metinOnbellek.has(g)) metinOnbellek.set(g, fetch(`veri/metin/${String(g).padStart(4, "0")}.json`).then(r => r.json()));
  return (await metinOnbellek.get(g))[i % meta.grup];
}

function f16toF32(u16) {
  // Float16 → Float32 (tarayıcıda Float16Array her yerde yok)
  const out = new Float32Array(u16.length);
  for (let i = 0; i < u16.length; i++) {
    const h = u16[i], s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;
    out[i] = e === 0 ? s * Math.pow(2, -14) * (f / 1024) : e === 31 ? (f ? NaN : s * Infinity) : s * Math.pow(2, e - 15) * (1 + f / 1024);
  }
  return out;
}

async function yukle() {
  try {
    const [metaYanit, vekYanit, olcekYanit] = await Promise.all([fetch("veri/meta.json"), fetch("veri/vektorler.i8"), fetch("veri/olcek.f16")]);
    meta = await metaYanit.json(); boyut = meta.boyut;
    vektorler = new Int8Array(await vekYanit.arrayBuffer());
    olcek = f16toF32(new Uint16Array(await olcekYanit.arrayBuffer()));
    model = await pipeline("feature-extraction", "model", {
      dtype: "q8",
      progress_callback: p => { if (p.status === "progress" && p.file.endsWith(".onnx")) $("#bar").style.width = p.progress.toFixed(0) + "%"; },
    });
    $("#bar").style.width = "100%";
    durum(`Hazır · ${meta.dosyalar.length} dosya, ${meta.adet} parça indeksli · model tarayıcıda çalışıyor`);
    $("#araBtn").disabled = false;
  } catch (e) { $("#hata").textContent = "Yükleme hatası: " + e.message; durum("Yüklenemedi"); }
}

// ---- Kanun maddesi atıfları (ör. "tck 181", "HMK m. 166", "5237 sayılı Kanun'un 181. maddesi") ----
const KANUN_NO = { "5237":"tck","5271":"cmk","6100":"hmk","4721":"tmk","6098":"tbk","6102":"ttk","2004":"iik","4857":"isk","2577":"iyuk","213":"vuk","6698":"kvkk","6502":"tkhk","1086":"humk","5510":"sgk","4734":"kik","4054":"rkhk","2709":"anayasa","2918":"ktk","6183":"aatuhk","193":"gvk","5520":"kvk","3065":"kdv","6769":"smk","5846":"fsek","7201":"tebligat","657":"dmk","6325":"arabuluculuk","4686":"tahkim" };
const KISALTMA = "(?:T\\.?C\\.?K|C\\.?M\\.?K|H\\.?M\\.?K|T\\.?M\\.?K|T\\.?B\\.?K|T\\.?T\\.?K|İ\\.?İ\\.?K|H\\.?U\\.?M\\.?K|İ\\.?Y\\.?U\\.?K|V\\.?U\\.?K|K\\.?V\\.?K\\.?K|T\\.?K\\.?H\\.?K|S\\.?M\\.?K|F\\.?S\\.?E\\.?K|K\\.?T\\.?K|A\\.?A\\.?T\\.?U\\.?H\\.?K|G\\.?V\\.?K|K\\.?V\\.?K|K\\.?İ\\.?K|R\\.?K\\.?H\\.?K|D\\.?M\\.?K|İş\\s?K(?:anunu)?|AİHS|Anayasa)";
const MADDE = "(?:'?[nN]ın|'?[nN]in|'?[nN]un|'?[nN]ün|'?nda|'?nde)?\\s*(?:m(?:adde(?:si|sinin|sinde)?|d)?\\.?\\s*)?(\\d{1,4})(?:\\s*[./]\\s*\\d{1,2})?";
const kisalt = k => k.replace(/[. ]/g, "").replace(/İ/g, "i").replace(/I/g, "i").toLowerCase().replace(/ı/g,"i").replace(/ş/g,"s").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/ğ/g,"g").replace("iskanunu","isk");
function atiflariBul(sorgu) {
  const anahtarlar = new Set(), etiketler = [];
  for (const e of sorgu.matchAll(new RegExp("\\b(" + KISALTMA + ")" + MADDE, "giu"))) { anahtarlar.add(`${kisalt(e[1])}:${+e[2]}`); etiketler.push(`${e[1].toUpperCase().replace(/\./g,"")} ${+e[2]}`); }
  for (const e of sorgu.matchAll(/\b(\d{3,4})\s*sayılı\s*(?:Türk\s+)?[\p{L}' ]{0,40}?(?:Kanun|Yasa)[^.\d]{0,30}?(\d{1,4})\s*\.?\s*(?:madde|md|m)/giu)) { const ad = KANUN_NO[e[1]] || "kanun" + e[1]; anahtarlar.add(`${ad}:${+e[2]}`); etiketler.push(`${e[1]} sayılı Kanun m. ${+e[2]}`); }
  if (!anahtarlar.size) for (const e of sorgu.matchAll(/\b(\d{1,4})\s*\.?\s*madde|\bmadde\s*(\d{1,4})\b/giu)) { const n = +(e[1] || e[2]); anahtarlar.add(`madde:${n}`); etiketler.push(`madde ${n}`); }
  return { anahtarlar: [...anahtarlar], etiketler };
}
let atifDizini = null;
async function atifDizinYukle() { if (!atifDizini) atifDizini = fetch("veri/atif.json").then(r => r.json()); return atifDizini; }

const kacis = t => t.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const kucult = t => t.toLocaleLowerCase("tr");
const DURAK = new Set(["için", "gibi", "olan", "olarak", "nasıl", "nedir", "midir", "mıdır", "ile", "veya", "ama", "daha", "çok", "bir", "bu", "şu", "ne", "mi", "mı", "mu", "mü"]);

function kelimeleriVurgula(metin, sorgu) {
  // Sorgu kelimelerinin ilk 5 harfiyle başlayan kelimeleri koyu yap (Türkçe ekleri tolere eder)
  const kokler = [...new Set(sorgu.split(/\s+/).map(kucult).filter(w => w.length >= 3 && !DURAK.has(w)).map(w => w.slice(0, Math.max(3, Math.min(5, w.length)))))];
  if (!kokler.length) return kacis(metin);
  return kacis(metin).replace(/[\p{L}\p{N}]+/gu, w => kokler.some(k => kucult(w).startsWith(k)) ? `<b>${w}</b>` : w);
}

async function enYakinCumle(metin, qv) {
  const cumleler = metin.split(/(?<=[.!?;:])\s+/).filter(c => c.trim().length > 15);
  if (cumleler.length < 2) return { metin, idx: -1, cumleler };
  const out = await model(cumleler.map(c => "passage: " + c), { pooling: "mean", normalize: true });
  let enIyi = 0, enIyiSkor = -1;
  for (let i = 0; i < cumleler.length; i++) {
    let s = 0; for (let j = 0; j < boyut; j++) s += qv[j] * out.data[i * boyut + j];
    if (s > enIyiSkor) { enIyiSkor = s; enIyi = i; }
  }
  return { idx: enIyi, cumleler };
}

async function ara() {
  const sorgu = $("#sorgu").value.trim(); if (!sorgu || !model) return;
  $("#araBtn").disabled = true;
  try {
    const q = await model("query: " + sorgu, { pooling: "mean", normalize: true });
    const qv = q.data, k = +$("#k").value, n = meta.adet;
    const skor = new Float32Array(n);
    for (let i = 0; i < n; i++) { let s = 0; const o = i * boyut; for (let j = 0; j < boyut; j++) s += qv[j] * vektorler[o + j]; skor[i] = s * olcek[i]; }
    // Sorguda kanun maddesi atfı varsa, o atfı içeren parçalar öne alınır
    const atif = atiflariBul(sorgu);
    let aday = null, bilgi = "";
    if (atif.anahtarlar.length) {
      const dizin = await atifDizinYukle();
      const idler = new Set(); for (const a of atif.anahtarlar) for (const i of (dizin[a] || [])) idler.add(i);
      const et = atif.etiketler.join(", ");
      if (idler.size) { aday = idler; bilgi = `<div class="bilgi">${kacis(et)} atfı geçen ${idler.size} parça önce listelendi; sıralama anlam benzerliğine göre.</div>`; }
      else bilgi = `<div class="bilgi">Arşivde "${kacis(et)}" atfı geçen belge bulunamadı; anlamca en yakın sonuçlar gösteriliyor.</div>`;
    }
    let sira;
    if (aday) {
      const once = [...aday].sort((a, b) => skor[b] - skor[a]).slice(0, k);
      const kalan = k - once.length;
      sira = kalan > 0 ? once.concat(Array.from(skor.keys()).filter(i => !aday.has(i)).sort((a, b) => skor[b] - skor[a]).slice(0, kalan)) : once;
    } else sira = Array.from(skor.keys()).sort((a, b) => skor[b] - skor[a]).slice(0, k);
    const metinler = await Promise.all(sira.map(metinGetir));
    const ad = i => meta.dosyalar[meta.dosya[i]];
    const rozet = i => aday && aday.has(i) ? `<span class="etiket">atıf eşleşti</span>` : "";
    $("#sonuclar").style.display = "block";
    $("#sonuclar").innerHTML = bilgi + sira.map((i, r) => `<div class="sonuc" id="s${i}"><div class="kaynak">${kacis(ad(i))}${rozet(i)}</div>${kelimeleriVurgula(metinler[r], sorgu)}<div class="skor">benzerlik ${skor[i].toFixed(3)} · en yakın cümle aranıyor…</div></div>`).join("");
    // Her sonuçta sorguya en yakın cümleyi işaretle
    for (const [r, i] of sira.entries()) {
      const { idx, cumleler } = await enYakinCumle(metinler[r], qv);
      const el = document.getElementById("s" + i); if (!el) continue;
      const govde = idx < 0 ? kelimeleriVurgula(metinler[r], sorgu)
        : cumleler.map((c, j) => j === idx ? `<mark>${kelimeleriVurgula(c, sorgu)}</mark>` : kelimeleriVurgula(c, sorgu)).join(" ");
      el.innerHTML = `<div class="kaynak">${kacis(ad(i))}${rozet(i)}</div>${govde}<div class="skor">benzerlik ${skor[i].toFixed(3)}</div>`;
    }
  } catch (e) { $("#hata").textContent = "Arama hatası: " + e.message; }
  finally { $("#araBtn").disabled = false; }
}
$("#araBtn").onclick = ara;
$("#sorgu").addEventListener("keydown", e => { if (e.key === "Enter") ara(); });
yukle();
</script>
</body>
</html>
