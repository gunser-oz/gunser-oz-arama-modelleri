name: Belgeleri indeksle (release zip'inden)

# Drive'dan elle indirilip release'e eklenen zip'leri açar, ince ayarlı modelle indeksler,
# tarayıcı verisini (web/veri) üretip main'e commit eder. Google API'ye dokunmaz.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Zip'lerin bulunduğu release tag'i
        required: true
        default: belgeler
      parca_boyu:
        description: Parça boyu (karakter); büyük değer daha az parça demektir
        required: true
        default: "1000"

jobs:
  indeksle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Zip'leri indir ve aç
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/zip /tmp/belgeler
          gh release download "${{ inputs.tag }}" -D /tmp/zip
          cd /tmp/zip
          for ilk in *.part_aa; do [ -e "$ilk" ] && { ad="${ilk%.part_aa}"; cat "$ad".part_* > "$ad"; rm "$ad".part_*; }; done
          for z in *.zip; do [ -e "$z" ] && unzip -o -q "$z" -d /tmp/belgeler -x '__MACOSX/*' '*.DS_Store'; done
          echo "Dosya sayısı: $(find /tmp/belgeler -type f | wc -l)"
          find /tmp/belgeler -type f | sed 's/.*\.//' | sort | uniq -c | sort -rn | head

      - name: İndeksle
        run: |
          sh modeller/e5-small-mmarco-tr/birlestir.sh
          python deneme/indeksle.py --klasor /tmp/belgeler --indeks /tmp/indeks --model modeller/e5-small-mmarco-tr --parca-boyu "${{ inputs.parca_boyu }}"
          cat /tmp/indeks/bilgi.json
          python egitim/web_veri.py --indeks /tmp/indeks --cikti web/veri

      - name: İndeksi release'e yükle (sunucu sürümü için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C /tmp -czf /tmp/indeks.tar.gz indeks
          gh release upload "${{ inputs.tag }}" /tmp/indeks.tar.gz --clobber

      - name: Tarayıcı verisini main'e commit et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A web/veri
          git diff --cached --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -q -m "web/veri: belge indeksi güncellendi ($(python -c "import json;b=json.load(open('/tmp/indeks/bilgi.json'));print(b['dosya_sayisi'],'dosya,',b['parca_sayisi'],'parça')"))"
          git push
          echo "Not: bu push Space yayınını tetiklemez; 'Hugging Face Space'e yayınla' iş akışını elle çalıştırın."
