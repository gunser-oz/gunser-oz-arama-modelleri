name: Belgeleri metne çevir (release zip'inden)

# Drive'dan elle indirilip release'e eklenen zip'leri açar, belgeleri düz metne çevirir ve
# metin arşivini (metin.tar.gz) aynı release'e yükler. İndeksleme ayrıca yapılır; GitHub'ın
# CPU'su 1,6 milyon parçayı vektörlemek için çok yavaş (55 saat).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Zip'lerin bulunduğu release tag'i
        required: true
        default: belgeler

jobs:
  indeksle:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: |
          pip install pypdf python-docx

      - name: Önceki çalıştırmadan çevrilmiş metinleri geri yükle
        uses: actions/cache/restore@v4
        with:
          path: /tmp/metin
          key: metin-${{ inputs.tag }}-${{ github.run_id }}
          restore-keys: metin-${{ inputs.tag }}-

      - name: Zip'leri tek tek indir, metne çevir, sil (disk tasarrufu)
        id: cevir
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/zip /tmp/metin
          df -h /tmp | tail -1
          # Bitmiş zip'ler işaretlenir; süre dolarsa (4 saat) kalanlar sonraki çalıştırmaya bırakılır
          for ad in $(gh release view "${{ inputs.tag }}" --json assets -q '.assets[].name' | grep -E '\.zip$'); do
            [ -f "/tmp/metin/.bitti-$ad" ] && { echo "Atlandı (önceden çevrildi): $ad"; continue; }
            if [ "$SECONDS" -gt 14400 ]; then echo "Süre sınırı: $ad sonraki çalıştırmada"; echo "tamam=false" >> $GITHUB_OUTPUT; exit 0; fi
            echo "== $ad ($((SECONDS/60)) dk)"
            gh release download "${{ inputs.tag }}" -p "$ad" -D /tmp/zip
            rm -rf /tmp/acilan && mkdir -p /tmp/acilan
            unzip -o -q "/tmp/zip/$ad" -d /tmp/acilan -x '__MACOSX/*' '*.DS_Store' || true
            rm -f "/tmp/zip/$ad"
            python deneme/metin_cikar.py --klasor /tmp/acilan --cikti /tmp/metin
            rm -rf /tmp/acilan
            touch "/tmp/metin/.bitti-$ad"
          done
          echo "tamam=true" >> $GITHUB_OUTPUT
          echo "Metin dosyası: $(find /tmp/metin -type f | wc -l), boyut: $(du -sh /tmp/metin | cut -f1)"

      - name: Çevrilmiş metinleri sakla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/metin
          key: metin-${{ inputs.tag }}-${{ github.run_id }}

      - name: Metin arşivini release'e yükle
        if: steps.cevir.outputs.tamam == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C /tmp -czf /tmp/metin.tar.gz metin
          ls -la /tmp/metin.tar.gz
          gh release upload "${{ inputs.tag }}" /tmp/metin.tar.gz --clobber
          echo "Yüklendi: metin.tar.gz"

      - name: Devam gerekiyor mu
        if: steps.cevir.outputs.tamam != 'true'
        run: echo "Metne çevirme bitmedi; iş akışını aynı girdilerle yeniden çalıştırın, kaldığı yerden sürer."
