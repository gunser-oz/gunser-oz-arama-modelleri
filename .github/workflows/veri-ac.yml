name: Türkçe MS MARCO verisini hazırla

# Hugging Face'teki Türkçe MS MARCO çevirisinden eğitim JSONL'i üretir
# ve sıkıştırıp release'e ek olarak yükler. Depoya büyük dosya girmez.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: veri-mmarco-tr
      kaynak:
        description: Hugging Face veri seti
        required: true
        default: newmindai/ms-marco-turkish-triplets
      adet:
        description: Kaç sorgu-belge çifti üretilecek
        required: true
        default: "100000"

jobs:
  hazirla:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Bağımlılıklar
        run: pip install datasets

      - name: JSONL üret
        run: |
          python egitim/veri_mmarco.py --kaynak "${{ inputs.kaynak }}" \
            --adet "${{ inputs.adet }}" --cikti /tmp/mmarco_tr_${{ inputs.adet }}.jsonl
          head -c 600 /tmp/mmarco_tr_${{ inputs.adet }}.jsonl; echo
          wc -l /tmp/mmarco_tr_${{ inputs.adet }}.jsonl

      - name: Release'e yükle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -k /tmp/mmarco_tr_${{ inputs.adet }}.jsonl
          gh release view "${{ inputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" --title "Türkçe MS MARCO eğitim verisi" --notes "veri_mmarco.py ile üretildi"
          gh release upload "${{ inputs.tag }}" /tmp/mmarco_tr_${{ inputs.adet }}.jsonl.gz --clobber
          echo "Yüklendi: mmarco_tr_${{ inputs.adet }}.jsonl.gz"
