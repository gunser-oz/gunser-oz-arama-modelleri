name: Hugging Face Space'e yayınla

# web/ klasörünü Static Space olarak Hugging Face'e gönderir (ücretsiz, sunucusuz;
# model tarayıcıda çalışır). Gereken secret'lar: HF_TOKEN (write), HF_SPACE (ör. ozanser/arama)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [web/**]

jobs:
  yayinla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Space'e gönder
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          [ -n "$HF_TOKEN" ] && [ -n "$HF_SPACE" ] || { echo "HF_TOKEN ve HF_SPACE secret'ları gerekli"; exit 1; }
          sh web/birlestir.sh && rm web/model/onnx/model_quantized.onnx.part_*
          cd web
          printf '%s\n' "---" "title: Günser Öz Arama" "emoji: ⚖️" "colorFrom: blue" "colorTo: gray" "sdk: static" "pinned: false" "---" "" \
            "Türkçe anlamsal belge araması. Model tarayıcıda çalışır, sorgular sunucuya gitmez." \
            "Kaynak: https://github.com/gunser-oz/gunser-oz-arama-modelleri" > README.md
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git lfs install --local
          git lfs track "*.onnx" "*.wasm" "*.f16" "model/tokenizer.json" >/dev/null
          git add -A
          git commit -q -m "Space yayını: $GITHUB_SHA"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "Yayınlandı: https://huggingface.co/spaces/${HF_SPACE}"
