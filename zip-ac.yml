name: Release zip'ini aç

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: veri-v1
      asset:
        description: Zip dosyasının adı (örn. model.zip)
        required: true

jobs:
  ac:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Zip'i release'den indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.tag }}" -p "${{ inputs.asset }}" -D /tmp

      - name: Aç
        run: |
          rm -rf modeller
          unzip -q "/tmp/${{ inputs.asset }}" -d modeller

      - name: 100 MiB üstü dosyaları LFS'e al
        run: |
          git lfs install
          find modeller -type f -size +100M -print0 | while IFS= read -r -d '' f; do
            git lfs track --filename "$f"
          done

      - name: Commit ve push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes modeller
          git diff --cached --quiet && { echo "Değişiklik yok"; exit 0; }
          git commit -m "modeller: ${{ inputs.asset }} açıldı"
          git push
